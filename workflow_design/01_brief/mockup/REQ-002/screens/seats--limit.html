<style>
.seat { border-radius: var(--r-s); background: var(--c-surface); box-shadow: inset 0 0 0 1px var(--c-line-strong); font-size: var(--fs-caption); font-weight: 600; color: var(--c-text-2); }
.seat[aria-pressed="true"] { background: var(--c-brand); color: var(--c-on-brand); box-shadow: none; }
.seat:disabled { background: var(--c-disabled-bg); box-shadow: none; }
.seat.is-lost { box-shadow: inset 0 0 0 2px var(--c-danger); }
.seat-row { font-size: var(--fs-caption); font-weight: 600; color: var(--c-text-2); text-align: center; }
.stage { padding: var(--stack-s); border-radius: var(--r-s); background: var(--c-bg); text-align: center; font-size: var(--fs-caption); font-weight: 600; color: var(--c-text-2); }
.legend { display: flex; flex-wrap: wrap; gap: var(--stack-m); font-size: var(--fs-caption); color: var(--c-text-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 14px; height: 14px; border-radius: var(--r-s); background: var(--c-surface); box-shadow: inset 0 0 0 1px var(--c-line-strong); }
.legend i.is-mine { background: var(--c-brand); box-shadow: none; }
.legend i.is-off { background: var(--c-disabled-bg); box-shadow: none; }
.btn:disabled { color: var(--c-text-2); }
.seatmap { display: grid; grid-template-columns: 20px repeat(5, minmax(44px, 1fr)); gap: 4px; align-items: center; }
.seatmap .seat { min-height: 44px; min-width: 44px; }
.overview { display: grid; grid-template-columns: 16px repeat(20, minmax(0, 1fr)); gap: 2px; align-items: center; }
.overview .seat { aspect-ratio: 1; border-radius: var(--r-s); }
.overview .seat-row { font-size: var(--fs-caption); }
.ovmap { display: flex; flex-direction: column; gap: var(--stack-s); }
.mini-bar { display: flex; align-items: center; gap: var(--stack-m); }
.mini-box { flex: none; width: 128px; padding: 4px; border-radius: var(--r-s); background: var(--c-bg); }
.mini { position: relative; display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 1px; }
.mini i { aspect-ratio: 1; background: var(--c-disabled-bg); }
.mini i.on { background: var(--c-text-3); }
.mini i.me { background: var(--c-brand); }
.mini-view { position: absolute; left: 5%; top: 0; width: 25%; height: 62.5%; border: 2px solid var(--c-brand-line); border-radius: var(--r-s); }
.mini-bar .row-sub { flex: 1; }
</style></head>
