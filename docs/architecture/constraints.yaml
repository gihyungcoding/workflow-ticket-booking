# 아키텍처 제약 — 기계가 검사하는 규칙만 여기 쓴다.
#
# scripts/check_architecture.py 가 이 파일을 읽어 Phase 4(검증)에서 위반을 찾는다.
#
# ★ 이 파일의 유일한 규칙: 검사할 수 없는 것을 쓰지 않는다.
#   "서비스는 응집도가 높아야 한다" 같은 것은 architecture.md 에 쓴다.
#   여기 쓰면 검사되지 않으면서 검사되는 것처럼 보인다.
#
# detect.type
#   forbidden_import  paths 의 파일에서 pattern 이 발견되면 위반
#   forbidden_path    paths 에 해당하는 파일이 존재하면 위반
#   required_path     paths 에 해당하는 파일이 하나도 없으면 위반
#
# severity
#   error   Phase 4 가 status: FAIL 로 판정한다 (다음 Phase 진입 불가)
#   warn    경고만 남기고 진행한다
#
# paths 는 glob 이다 (** 지원). pattern 은 파이썬 정규식이며 줄 단위로 매칭한다.

version: 1

constraints:
  - id: ARCH-001
    rule: "API(Controller) 계층은 Repository 를 직접 호출하지 않는다 (Service 를 거친다)"
    rationale: "트랜잭션 경계와 좌석 선점 규칙을 Service 계층에 고정하기 위함"
    adr: ADR-0003
    detect:
      type: forbidden_import
      paths: ["backend/src/main/java/**/api/**/*.java"]
      pattern: "^\\s*import .*\\.repository\\..*;"
    severity: error

  - id: ARCH-002
    rule: "Service 계층은 Controller(API) 를 호출하지 않는다 (역방향 의존 금지)"
    rationale: "역방향 의존은 순환 참조와 계층 경계 붕괴로 이어진다"
    adr: ADR-0003
    detect:
      type: forbidden_import
      paths: ["backend/src/main/java/**/service/**/*.java"]
      pattern: "^\\s*import .*\\.api\\..*;"
    severity: error

  - id: ARCH-003
    rule: "Service 계층은 영속성 프레임워크 타입을 직접 다루지 않는다 (쿼리는 Repository 가 소유)"
    rationale: "architecture.md §2 — Service 는 SQL 을 직접 작성하지 않는다"
    adr: ADR-0003
    detect:
      type: forbidden_import
      paths: ["backend/src/main/java/**/service/**/*.java"]
      pattern: "^\\s*import org\\.springframework\\.data\\.jpa\\..*;|^\\s*import jakarta\\.persistence\\.criteria\\..*;"
    severity: error

