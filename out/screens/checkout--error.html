<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>4/4 확인 · 결제 수단 · 오류</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
  .step { display: flex; flex-direction: column; gap: var(--stack-s); margin: 0 var(--page-x); }
  .step-names { font-size: var(--fs-sub); color: var(--c-text-3); }
  .pick .row { padding-left: var(--stack-m); padding-right: var(--stack-m); border: 1px solid var(--c-line); border-radius: var(--r-m); width: 100%; text-align: left; }
  .pick .row + .row { margin-top: var(--stack-s); }
  .pick .row[aria-checked="true"] { border-color: var(--c-brand-line); }
  .pick .row[aria-checked="true"] .row-title { color: var(--c-brand-text); }
  .pick .row .row-trail svg { visibility: hidden; }
  .pick .row[aria-checked="true"] .row-trail svg { visibility: visible; color: var(--c-brand-line); }
  .sum { display: flex; justify-content: space-between; align-items: baseline; gap: var(--stack-s); }
  .pick .row:disabled .row-title, .pick .row:disabled .row-sub { color: var(--c-text-disabled); }
</style>
</head>
<body class="has-cta">
<!-- 정책: 카드·네이버페이·카카오페이는 추가 비용 없이 붙일 수 있을 때만 노출(PRD 5-3 조건부) -->
<header class="appbar"><a class="appbar-btn" href="seat.html" aria-label="뒤로 — 좌석 선택"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">예매 확인</h1><span></span></header>
<main class="page">
  <div class="step">
    <div class="progress" role="progressbar" aria-label="예매 4단계 중 4단계" aria-valuenow="4" aria-valuemax="4"><span class="is-on"></span><span class="is-on"></span><span class="is-on"></span><span class="is-on"></span></div>
    <p class="step-names">회차 · 구역 · 좌석 · <span class="num">4/4 확인</span></p>
  </div>

  <section class="block">
    <p class="h2">잡아 둔 <span class="num">7분</span>이 지났어요</p>
    <p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>C열 14·15·16번이 풀려 다른 관객이 고를 수 있어요</p>
  </section>

  <section class="block is-list">
    <div class="row"><span class="thumb"><img src="../assets/photos/luminous-stage.jpg" alt="루미너스 콘서트 무대"></span>
      <div class="row-main"><p class="row-title">루미너스 콘서트 〈WAVELENGTH〉 서울</p><p class="row-sub">1회 12월 19일(토) 오후 6:00 · 고척스카이돔</p></div></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/ticket.svg" alt=""></span>
      <div class="row-main"><p class="row-sub">좌석 · 풀림</p><p class="row-title">고른 자리 없음 — 다시 골라 주세요</p></div></div>
      </section>

  <section class="block">
    <div class="block-head"><h2 class="h2">결제 수단</h2></div>
    <div class="pick" role="radiogroup" aria-label="결제 수단">
      <button class="row" role="radio" aria-checked="false" disabled><div class="row-main"><p class="row-title">무통장 입금</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button>
      <button class="row" role="radio" aria-checked="false" disabled><div class="row-main"><p class="row-title">카드</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button>
      <button class="row" role="radio" aria-checked="false" disabled><div class="row-main"><p class="row-title">네이버페이</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button>
      <button class="row" role="radio" aria-checked="false" disabled><div class="row-main"><p class="row-title">카카오페이</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button>
    </div>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="seat.html">다시 고르기</a></div>
</body></html>
