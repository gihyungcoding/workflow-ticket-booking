<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>비밀번호를 바꿨어요</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
  .wait { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--stack-l); min-height: calc(100vh - var(--h-appbar) * 2); text-align: center; color: inherit; text-decoration: none; }
  .wait-art { width: 72px; height: 72px; }
  .wait-art img { width: 100%; height: 100%; }
  .wait .lead { max-width: 280px; }
  .wait-spin { width: 32px; height: 32px; border-radius: var(--r-pill); border: 3px solid var(--c-line); border-top-color: var(--c-brand); animation: spin .8s linear infinite; }
  .addr { font-size: var(--fs-strong); font-weight: var(--fw-strong); color: var(--c-text-1); overflow-wrap: anywhere; }
</style>
</head>
<body class="plain has-cta">
<!-- 상태: 완료 — 새 비밀번호로 직접 로그인한다. 기존에 로그인한 기기는 그대로 둔다 -->
<!-- 정책: 비밀번호를 바꿨다는 알림 메일이 나간다(비밀번호는 담지 않는다) -->
<main class="page">
  <div class="wait">
    <span class="wait-art"><img src="../assets/fluent/ticket.svg" alt=""></span>
    <h1 class="title" data-anchor>비밀번호를 바꿨어요</h1>
    <p class="lead">새 비밀번호로 로그인해 주세요</p>
  </div>
</main>
<div class="cta"><a class="btn primary full" href="login.html">로그인하기</a></div>
</body></html>
