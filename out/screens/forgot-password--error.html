<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>비밀번호 찾기 · 오류</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
  .form { display: flex; flex-direction: column; gap: var(--stack-m); }
</style>
</head>
<body class="plain has-cta">
<!-- 정책: 가입된 이메일이든 아니든, 소셜 전용 계정이든 같은 접수 문구 — 계정이 있는지 알려 주지 않는다 -->
<!-- 정책: 소셜 전용 계정에는 재설정 대신 「소셜 계정으로 로그인해 주세요」 안내 메일을 보낸다 -->
<!-- 정책: 같은 이메일에는 60초에 한 번만 메일이 나간다 — 건너뛰어도 응답은 같다 -->
<!-- 상태: 이메일 칸이 비었거나 형식이 틀리면 칸 아래 오류. 요청은 가지 않는다 -->
<header class="appbar"><a class="appbar-btn" href="login.html" aria-label="뒤로 — 로그인"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><span></span><span></span></header>
<main class="page">
  <header class="hero">
    <h1 class="title">비밀번호를 잊었나요</h1>
    <p class="lead">가입한 이메일을 알려 주면 새 비밀번호를 정할 링크를 보내 드려요</p>
  </header>

  <form class="form" action="forgot-password--done.html">
    <div class="field is-error"><label class="label" for="email">이메일</label><input class="input" id="email" type="email" autocomplete="email" placeholder="이메일 주소" aria-invalid="true" aria-describedby="email-msg" autofocus><p class="field-msg" id="email-msg" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>이메일을 입력해 주세요</p></div>
  </form>
</main>
<div class="cta"><button class="btn primary full" data-stay="이메일을 입력해 주세요">재설정 메일 보내기</button></div>
</body></html>
