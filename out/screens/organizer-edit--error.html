<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>정보 수정</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="organizer-show.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">정보 수정</h1><span></span></header>
<main class="page">
  <header class="hero">
    <p class="title">비공개라 언제든 고칠 수 있어요</p>
  </header>
  <div class="field is-error"><label class="label" for="title">공연명</label><input class="input" id="title" value="" aria-invalid="true"><p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>공연명을 입력해 주세요</p></div>
  <div class="field"><label class="label" for="venue">장소</label><input class="input" id="venue" value="롤링홀"></div>
  <div class="field"><label class="label" for="start">공연 일시</label><input class="input" id="start" value="12월 26일(토) 오후 7:00"></div>
  <div class="field"><label class="label" for="open">예매 오픈</label><input class="input" id="open" value="12월 1일(화) 오후 8:00"></div>
  <div class="field"><label class="label" for="close">예매 마감</label><input class="input" id="close" value="12월 26일(토) 오후 5:00"></div>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">좌석 300석 · 바꿀 수 없어요</h2></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/ticket.svg" alt=""></span>
      <div class="row-main"><p class="row-title">R석 · A~F열</p><p class="row-sub">열당 20석 · 120석</p></div><span class="row-trail"><span class="price-now">55,000원</span></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/ticket.svg" alt=""></span>
      <div class="row-main"><p class="row-title">S석 · G~O열</p><p class="row-sub">열당 20석 · 180석</p></div><span class="row-trail"><span class="price-now">44,000원</span></span></div>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="organizer-show.html">저장하기</a></div>
</body></html>
