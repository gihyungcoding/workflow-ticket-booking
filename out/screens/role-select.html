<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>역할 선택 · 처음 가입</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
  .pick .row { padding-left: var(--stack-m); padding-right: var(--stack-m); border: 1px solid var(--c-line); border-radius: var(--r-m); }
  .pick .row + .row { margin-top: var(--stack-s); }
  .pick .row[aria-checked="true"] { border-color: var(--c-brand-line); }
  .pick .row[aria-checked="true"] .row-title { color: var(--c-brand-text); }
  .pick .row .row-trail svg { visibility: hidden; }
  .pick .row[aria-checked="true"] .row-trail svg { visibility: visible; color: var(--c-brand-line); }
  .who { overflow-wrap: anywhere; }
</style>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="login.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><span></span><span></span></header>
<main class="page">
  <header class="hero">
    <p class="eyebrow">카카오로 처음 가입</p>
    <h1 class="title"><span class="who">harin.kim@kakao.com</span>(김하린)으로 가입하고 있어요</h1>
  </header>
  <div class="field"><span class="label">역할</span>
    <div class="pick" role="radiogroup" aria-label="역할">
      <button class="row" role="radio" aria-checked="true"><span class="row-art"><img src="../assets/fluent/ticket.svg" alt=""></span><div class="row-main"><p class="row-title">관객</p><p class="row-sub">공연을 찾고 예매해요</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button>
      <button class="row" role="radio" aria-checked="false"><span class="row-art"><img src="../assets/fluent/clipboard.svg" alt=""></span><div class="row-main"><p class="row-title">주최자</p><p class="row-sub">공연을 등록하고 관리해요</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button>
    </div>
  </div>
  <p class="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg><span>5분 안에 골라 주세요. 가입한 뒤에는 역할을 바꿀 수 없어요</span></p>
</main>
<div class="cta"><a class="btn primary full" href="joined.html">계속하기</a></div>
</body></html>
