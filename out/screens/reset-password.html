<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>비밀번호 재설정</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
  .form { display: flex; flex-direction: column; gap: var(--stack-m); }
</style>
</head>
<body class="plain has-cta">
<!-- 정책: 메일의 링크(/reset-password#token=…)로 들어온다. 토큰은 읽는 즉시 주소에서 지운다 -->
<!-- 정책: 비밀번호는 가입과 같은 규칙 — 8자 이상 72자 이하, 확인란과 같아야 한다 -->
<!-- 정책: 바꾸고 나서 자동 로그인하지 않는다. 이메일 인증이 안 된 계정이면 이 재설정이 인증도 겸한다 -->
<header class="appbar"><a class="appbar-btn" href="login.html" aria-label="뒤로 — 로그인"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><span></span><span></span></header>
<main class="page">
  <header class="hero">
    <h1 class="title">새 비밀번호를 정해요</h1>
    <p class="lead">다른 곳에서 쓰지 않는 비밀번호가 안전해요</p>
  </header>

  <form class="form" action="reset-password--done.html">
    <div class="field"><label class="label" for="pw">새 비밀번호</label><input class="input" id="pw" type="password" autocomplete="new-password" placeholder="새 비밀번호" aria-describedby="pw-help" autofocus><p class="block-note" id="pw-help">8자 이상 72자 이하로 정해요</p></div>
    <div class="field"><label class="label" for="pw2">새 비밀번호 확인</label><input class="input" id="pw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력"></div>
  </form>
</main>
<div class="cta"><a class="btn primary full" href="reset-password--done.html">비밀번호 바꾸기</a></div>
</body></html>
