# 배포 환경 설정 (TASK-014)
#
# 루트의 application.properties 는 테스트 리소스가 같은 이름으로 가려서(test classpath 우선)
# 테스트에서 로딩되지 않는다. 배포 설정은 classpath:/config/ 에 둬 둘 다 로딩되게 한다.
# DB 접속 정보는 파일에 쓰지 않는다 — SPRING_DATASOURCE_URL/USERNAME/PASSWORD 환경변수로 받는다.
server.port=${PORT:8080}

# 열거형은 문자열 이름으로만 받는다 — 숫자(서수)를 허용하면 role: 1 이 ORGANIZER 로 조용히 통과한다 (TASK-009 SC-04)
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
