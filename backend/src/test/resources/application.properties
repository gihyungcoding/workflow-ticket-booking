# 테스트 DB — H2 인메모리 (임시)
#
# 프로덕션은 PostgreSQL 이다. H2 는 ON CONFLICT ... DO UPDATE ... WHERE 를
# 지원하지 않으므로 ADR-0004(좌석 선점)를 검증할 수 없다.
# 좌석 선점 기능 착수 전에 Testcontainers 로 전환한다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# TASK-009: JWT 서명 키 (테스트 전용 값, 32바이트 이상)
JWT_SECRET=test-only-jwt-secret-0123456789abcdef

# TASK-027: 메일 전송 방식과 링크 기준 주소 — 둘 다 항상 필수(사용자 결정 2026-11-19)
MAIL_TRANSPORT=log
FRONTEND_BASE_URL=http://localhost:5173
